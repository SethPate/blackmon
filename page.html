<title>Blackmon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one time-ordered column of event rows; each row is time | what and where | three travel modes. */
:root {
  --bg: #f4f5f8; --card: #ffffff; --ink: #121826; --mute: #5a6478; --line: #dde2ea; --chip: #e9ecf2;
  --accent: #cc4e08; --far: #8791a3;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d121e; --card: #151b2b; --ink: #e9edf5; --mute: #97a2b7; --line: #252f47; --chip: #1e2639; --accent: #ff8a3d; --far: #6f7b93; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d121e; --card: #151b2b; --ink: #e9edf5; --mute: #97a2b7; --line: #252f47; --chip: #1e2639; --accent: #ff8a3d; --far: #6f7b93; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); padding-inline: 16px; padding-block: 20px 56px; }
.wrap { max-width: 980px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
h1 { font: 400 28px/1 var(--display); letter-spacing: -0.01em; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.day { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 600; font-size: 17px; }
button { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--mute); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; color: var(--mute); font-size: 13.5px; margin: 10px 0 4px; }
.home { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.home b { color: var(--ink); font-weight: 600; }
.home input { font: inherit; width: min(320px, 100%); padding: 3px 8px; border: 1px solid var(--mute); border-radius: 6px; background: var(--card); color: var(--ink); }
.note { color: var(--accent); font-size: 13px; margin: 4px 0 0; }
label { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 5px; }
.hour { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--mute); margin: 20px 0 6px; }
.ev { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
.ev.past { opacity: .5; }
.t { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.acts { color: var(--mute); font-weight: 400; }
.where { color: var(--mute); font-size: 13.5px; overflow-wrap: anywhere; }
.where b { color: var(--ink); font-weight: 600; }
.pin { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-left: 6px; }
.modes { display: grid; grid-template-columns: 62px 62px 230px; gap: 10px; font-size: 13px; color: var(--mute); min-width: 0; }
.mode { min-width: 0; }
.mode .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.mode .v { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink); white-space: nowrap; }
.mode.best .v { font-weight: 700; }
.mode.far .v { color: var(--far); }
.mode .d { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; text-align: center; font-size: 11px; font-weight: 700; padding: 0 4px; margin-left: 3px; vertical-align: 1px; }
.empty { color: var(--mute); background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 22px 16px; margin-top: 18px; }
.foot { color: var(--mute); font-size: 13px; margin-top: 22px; max-width: 70ch; }
@media (max-width: 720px) {
  .ev { grid-template-columns: 68px minmax(0, 1fr); }
  .modes { grid-column: 1 / -1; grid-template-columns: 62px 62px minmax(0, 1fr); margin-top: 4px; }
  .mode .d { white-space: normal; }
}
</style>
<div class="wrap">
  <header>
    <h1>Black<span>mon</span></h1>
    <div class="day"><button id="prev" aria-label="Previous day">&lsaquo;</button><span id="day"></span><button id="next" aria-label="Next day">&rsaquo;</button><button id="now">Today</button></div>
  </header>
  <div class="bar">
    <span class="home" id="home"></span>
    <label><input type="checkbox" id="mine"> Saved venues only</label>
    <label><input type="checkbox" id="hidepast" checked> Hide started</label>
  </div>
  <p class="note" id="note" hidden></p>
  <div id="list"><div class="empty">Loading tonight&rsquo;s list&hellip;</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// MTA line colours: [background, text]
const LINE = {1:'#EE352E',2:'#EE352E',3:'#EE352E',4:'#00933C',5:'#00933C',6:'#00933C',7:'#B933AD',A:'#0039A6',C:'#0039A6',E:'#0039A6',
  B:'#FF6319',D:'#FF6319',F:'#FF6319',M:'#FF6319',G:'#6CBE45',J:'#996633',Z:'#996633',L:'#A7A9AC',N:'#FCCC0A',Q:'#FCCC0A',R:'#FCCC0A',W:'#FCCC0A',S:'#808183',SIR:'#0039A6'};
const DARK_TEXT = 'NQRWLG';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nyParts = () => Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).formatToParts(new Date()).map(p => [p.type, p.value]));
const today = () => { const p = nyParts(); return `${p.year}-${p.month}-${p.day}`; };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
const shiftDate = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

let db = null, date = today(), day = undefined, home = undefined, editing = false, stopDay = null, dbState = 'wait';

const fmtTime = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const fmtHour = t => { const h = Number(t.slice(0, 2)); return `${h % 12 || 12} ${h >= 12 ? 'PM' : 'AM'}`; };
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}` : `${m} min`;

function mode(k, v, detail, best, far, tip) {
  return `<div class="mode${best ? ' best' : ''}${far ? ' far' : ''}" title="${esc(tip || '')}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${detail || ''}</div></div>`;
}
function modes(r) {
  if (!r) return '<div class="modes"><div class="mode far"><div class="k">travel</div><div class="v">&ndash;</div><div class="d">not routed yet</div></div></div>';
  const s = r.subway, w = r.walk, b = r.bike;
  const best = Math.min(w ? w.min : 1e9, b ? b.min : 1e9, s ? s.min : 1e9);
  const lines = s ? s.lines.map(l => `<span class="ln" style="background:${LINE[l] || '#555'};color:${DARK_TEXT.includes(l) ? '#000' : '#fff'}">${esc(l)}</span>`).join('') : '';
  const tip = s ? s.legs.map(l => `${l.line}: ${l.board} to ${l.alight}`).join('; ') + `. Walk ${s.walk_a} min to the train, ${s.walk_b} min after.` : '';
  const none = k => mode(k, '&ndash;', 'no land route', false, true, 'No route without a ferry');
  return '<div class="modes">' +
    (w ? mode('walk', fmtMin(w.min), `${w.mi} mi`, w.min === best, w.min > 45) : none('walk')) +
    (b ? mode('bike', fmtMin(b.min), `${b.mi} mi`, b.min === best, false) : none('bike')) +
    mode('subway', s ? fmtMin(s.min) + lines : '&ndash;', s ? esc(`${s.legs[0].board} → ${s.legs[s.legs.length - 1].alight}`) : w ? 'walk it' : '', s && s.min === best, !s, tip) +
    '</div>';
}

function renderHome() {
  if (editing) return;
  const h = home || {};
  const label = (h.label || (day && day.home_label) || '').replace(/, NY, USA$/, '');
  $('home').innerHTML = label ? `from <b>${esc(label)}</b> <button id="edit"${db ? '' : ' disabled'}>change</button>` : '';
  const n = $('note');
  if (h.requested) { n.hidden = false; n.textContent = `Address change to “${h.requested}” is saved. Travel times switch over at the next pull (10 AM and 4 PM).`; }
  else if (h.request_error) { n.hidden = false; n.textContent = `Could not find “${h.request_error}” in New York, so the address was left as it was.`; }
  else n.hidden = true;
}

function render() {
  const t = today(), isToday = date === t;
  $('day').textContent = parse(date).toLocaleDateString('en-US', {timeZone: 'UTC', weekday: 'long', month: 'short', day: 'numeric'}) + (isToday ? ' · tonight' : '');
  $('now').disabled = isToday;
  $('prev').disabled = date <= t;
  renderHome();
  if (dbState !== 'ok') { $('list').innerHTML = `<div class="empty">${dbState === 'wait' ? 'Loading tonight’s list…' : 'The list can’t be loaded in this view. Open the page signed in to Claude.'}</div>`; $('foot').textContent = ''; return; }
  if (day === undefined) { $('list').innerHTML = '<div class="empty">Loading…</div>'; $('foot').textContent = ''; return; }
  if (day === null) { $('list').innerHTML = '<div class="empty">Nothing has been pulled for this day yet. Blackmon pulls today and tomorrow at 10 AM and 4 PM.</div>'; $('foot').textContent = ''; return; }
  const p = nyParts(), nowT = `${p.hour}:${p.minute}`;
  let evs = day.events.filter(e => !$('mine').checked || e.pinned);
  const started = e => isToday && e.time && e.time < nowT && e.time >= '05:00';
  const hidden = $('hidepast').checked ? evs.filter(started).length : 0;
  if ($('hidepast').checked) evs = evs.filter(e => !started(e));
  let html = '', hour = null;
  for (const e of evs) {
    const h = e.time ? fmtHour(e.time) : 'Time not listed';
    if (h !== hour) { html += `<div class="hour">${h}</div>`; hour = h; }
    const where = [e.street, e.city && e.city !== 'New York' ? e.city : ''].filter(Boolean).join(', ');
    const safe = /^https?:\/\//.test(e.url || '');
    html += `<div class="ev${started(e) ? ' past' : ''}"><div class="t">${fmtTime(e.time) || '&ndash;'}</div>
      <div><div class="title">${safe ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}${(e.acts || []).length ? ` <span class="acts">with ${esc(e.acts.join(', '))}</span>` : ''}</div>
      <div class="where"><b>${esc(e.venue)}</b>${e.pinned ? '<span class="pin">saved</span>' : ''}${where ? ' · ' + esc(where) : ''}</div></div>
      ${modes(e.route)}</div>`;
  }
  if (!evs.length) html = `<div class="empty">Nothing listed${hidden ? ' that hasn’t already started' : ''}${$('mine').checked ? ' at your saved venues' : ''}.</div>`;
  $('list').innerHTML = html;
  const bySrc = {};
  for (const s of day.sources || []) { const b = bySrc[s.source] ||= {n: 0, bad: false}; b.n += s.on_date || 0; b.bad ||= !s.ok; }
  const src = Object.entries(bySrc).map(([k, v]) => `${k} ${v.bad ? 'failed' : v.n}`).join(' · ');
  $('foot').textContent = `${evs.length} shown${hidden ? `, ${hidden} already started` : ''}. ` +
    (day.fetched_at ? `Pulled ${new Date(day.fetched_at).toLocaleString('en-US', {timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit'})} from: ${src}. ` : '') +
    `Concerts only for now; no theater, dance, opera, film or readings yet. Subway times are a ${String(day.profile || '').toLowerCase()}-evening timetable estimate, not live.` +
    (day.route_error ? ' Some travel times are missing because the routing service did not answer.' : '');
}

function watchDay() {
  if (stopDay) stopDay();
  day = undefined;
  render();
  if (!db) return;
  const want = date;
  stopDay = db.doc('days/' + want).onSnapshot(s => { if (want !== date) return; day = s.exists ? s.data() : null; render(); },
    () => { if (want === date) { day = null; render(); } });
}
function go(d) { date = d; watchDay(); }

async function saveHome() {
  const v = $('addr').value.trim().replace(/\s+/g, ' ');
  if (!v) return;
  $('save').disabled = true;
  try {
    const next = Object.assign({}, home || {}, {requested: v});
    delete next.request_error;
    await db.doc('config/home').set(next);
    editing = false; renderHome();
  } catch (e) {
    $('herr').textContent = 'Could not save. Try again.';
    $('save').disabled = false;
  }
}

document.addEventListener('click', ev => {
  const id = ev.target.id;
  if (id === 'prev') go(shiftDate(date, -1));
  else if (id === 'next') go(shiftDate(date, 1));
  else if (id === 'now') go(today());
  else if (id === 'edit') {
    editing = true;
    const cur = (home && (home.requested || home.address)) || '';
    $('home').innerHTML = `from <input id="addr" value="${esc(cur)}" aria-label="Home address" autocomplete="off"> <button id="save">save</button> <button id="cancel">cancel</button> <span id="herr"></span>`;
    $('addr').focus(); $('addr').select();
  }
  else if (id === 'cancel') { editing = false; renderHome(); }
  else if (id === 'save') saveHome();
});
document.addEventListener('keydown', ev => {
  if (ev.target.id !== 'addr') return;
  if (ev.key === 'Enter') saveHome();
  if (ev.key === 'Escape') { editing = false; renderHome(); }
});
$('mine').onchange = $('hidepast').onchange = render;
render();

(async () => {
  db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  dbState = db ? 'ok' : 'none';
  if (!db) { render(); return; }
  db.doc('config/home').onSnapshot(s => { home = s.exists ? s.data() : null; renderHome(); }, () => {});
  watchDay();
})();
</script>
